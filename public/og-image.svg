<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- 배경 -->
  <rect width="1200" height="630" fill="#2c2a26"/>

  <!-- 배경 라인 텍스처 -->
  <defs>
    <pattern id="lines" x="0" y="0" width="1200" height="48" patternUnits="userSpaceOnUse">
      <line x1="0" y1="47" x2="1200" y2="47" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#lines)"/>

  <!-- 골드 사이드 액센트 -->
  <rect x="0" y="0" width="4" height="630" fill="#c9b99a" opacity="0.6"/>
  <rect x="1196" y="0" width="4" height="630" fill="#c9b99a" opacity="0.6"/>

  <!-- 중앙 컨텐츠 -->
  <!-- 브랜드 태그 -->
  <rect x="480" y="195" width="240" height="28" rx="14" fill="rgba(201,185,154,0.15)" stroke="#c9b99a" stroke-width="1" stroke-opacity="0.3"/>
  <text x="600" y="214" font-family="serif" font-size="11" fill="#c9b99a" text-anchor="middle" letter-spacing="4">일오책방</text>

  <!-- 메인 타이틀 -->
  <text x="600" y="310" font-family="serif" font-size="72" font-weight="300" fill="#f0ebe3" text-anchor="middle" letter-spacing="12">혼자여도</text>
  <text x="600" y="395" font-family="serif" font-size="72" font-weight="300" fill="#f0ebe3" text-anchor="middle" letter-spacing="12">괜찮은 시간</text>

  <!-- 구분선 -->
  <line x1="560" y1="425" x2="640" y2="425" stroke="#c9b99a" stroke-width="1" opacity="0.4"/>

  <!-- 서브 텍스트 -->
  <text x="600" y="465" font-family="sans-serif" font-size="18" fill="#a89b87" text-anchor="middle" letter-spacing="3">조용히 책 읽고 쉬어가는 팝업 북카페</text>

  <!-- URL -->
  <text x="600" y="570" font-family="sans-serif" font-size="13" fill="#6a5f52" text-anchor="middle" letter-spacing="1">bookcafe-taupe.vercel.app</text>
